# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "kotlin.version"
      test-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
